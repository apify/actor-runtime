name: CI

on:
    push:
        branches: [master, v2-poc-requirements]
    pull_request:

jobs:
    checks:
        name: Build, lint, unit + integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            # Installs the pnpm version pinned by package.json's `packageManager` field; must run
            # before setup-node so its `cache: pnpm` can find the pnpm store.
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run format:check
            - run: pnpm test

    e2e:
        name: e2e ${{ matrix.file }} (apify-cli + ${{ matrix.engine }})
        # `podman-3.4` is the Podman 3.x leg: Ubuntu 22.04's stock Podman 3.4.4, which the ubuntu-22.04
        # runner image ships preinstalled - the CNI generation, with no usable user-defined networks.
        runs-on: ${{ matrix.engine == 'podman-3.4' && 'ubuntu-22.04' || 'ubuntu-latest' }}
        # `all-modes` gets a wider budget than the rest: it is the only file that pushes a Playwright
        # Actor AND installs and compiles that Actor's sources on the runner before it can run anything.
        timeout-minutes: ${{ matrix.file == 'all-modes' && 45 || 30 }}
        strategy:
            fail-fast: false
            # One job per e2e file and container engine. Each file starts its own runtime container on
            # the fixed host ports (3333/3000), so files cannot share a daemon; separate runners make them
            # parallel instead. The `podman` legs drive the runner's preinstalled Podman rootless, as the
            # runner user - the same suite, unchanged, against the other supported engine (`test.md`):
            # Podman 4 on the default runner, Podman 3.4 on the Ubuntu 22.04 one.
            matrix:
                engine:
                    - docker
                    - podman
                    - podman-3.4
                file:
                    - actor-dev-loop
                    - debug-mode
                    - dev-folder-bind-mount
                    - browser-view-ts
                    - browser-view-py
                    - all-modes
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Rootless Podman serves its Docker-compatible API on a socket only when asked to. The suite
            # drives Podman through `CONTAINER_CLI=podman` and mounts the socket named by `DOCKER_HOST`
            # into the runtime container.
            - name: Serve the Podman API socket
              if: startsWith(matrix.engine, 'podman')
              run: |
                  podman --version
                  sock="$RUNNER_TEMP/podman.sock"
                  nohup podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/podman-service.log" 2>&1 &
                  for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
                  podman --url "unix://$sock" info --format '{{.Host.Arch}}' >/dev/null
                  echo "CONTAINER_CLI=podman" >> "$GITHUB_ENV"
                  echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
            # The suite manages the engine itself against the runner's daemon: it pre-pulls the
            # Actor base images, builds the runtime image, starts the runtime container with
            # the host engine's socket, and drives it with stock apify-cli via npx.
            - run: pnpm exec vitest run test/e2e/${{ matrix.file }}.test.ts
            # The e2e's runtime container is normally removed by the suite's afterAll; on
            # failure it is left running, so its server-side view of any failed request
            # (log-stream lifecycle included) is captured here for diagnosis.
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  cli=${{ matrix.engine == 'docker' && 'docker' || 'podman' }}
                  for c in $($cli ps -aq --filter name=actor-runtime-e2e); do
                    $cli logs --tail 300 "$c" || true
                  done

    e2e-macos:
        name: e2e actor-dev-loop (apify-cli + docker on macOS)
        # `system.md` lists macOS as a supported host; until now nothing verified it, so every macOS
        # regression had to be found by hand. This leg runs the mandated dev-loop e2e - push, build, call,
        # input-dependent item count - against a real engine on a real macOS host.
        runs-on: macos-15
        # A macOS runner has no engine preinstalled, so this job pays for a Linux VM boot on top of
        # everything the Linux legs do, and does it on Apple silicon.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Colima is how a Mac gets a Docker-Engine-API daemon without Docker Desktop's licensing: a
            # Lima-managed Linux VM plus the stock `docker` CLI, which `colima start` also points at it by
            # creating and selecting a `colima` docker context.
            #
            # DOCKER_HOST is deliberately NOT set. The suite mounts the host engine's socket into the
            # runtime container (`helpers/docker.ts`), and a `-v` source is resolved by the daemon - i.e.
            # inside the VM, where the socket is at the default `/var/run/docker.sock`. Pointing the suite
            # at Colima's host-side forwarding socket (`~/.colima/.../docker.sock`) would mount that path
            # as seen from *inside* the VM, which is not a socket the daemon can be reached through.
            - name: Start a container engine (Colima)
              run: |
                  brew install colima docker
                  colima start --cpu 3 --memory 8 --disk 30 --vm-type=vz --mount-type=virtiofs
                  docker version
                  docker info --format '{{.OperatingSystem}} / {{.Architecture}}'
            # Only the dev-loop file. GitHub's macOS runners are Apple silicon, and
            # `apify/actor-node-playwright-chrome` publishes no arm64 image - so `browser-view-*` and
            # `all-modes` cannot run here at all, while `debug-mode` and `dev-folder-bind-mount` would add
            # macOS-specific host-path and port-forwarding questions on top of the core flow this leg is
            # meant to protect. `apify/actor-node:24`, `apify/actor-python:3.13` and `python:3.11-slim`
            # (the images this file needs) are all multi-arch, so it runs natively, unemulated.
            - run: pnpm exec vitest run test/e2e/actor-dev-loop.test.ts
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  for c in $(docker ps -aq --filter name=actor-runtime-e2e); do
                    docker logs --tail 300 "$c" || true
                  done
