name: CI

on:
    push:
        branches: [master, v2-poc-requirements]
    pull_request:

jobs:
    checks:
        name: Build, lint, unit + integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            # Installs the pnpm version pinned by package.json's `packageManager` field; must run
            # before setup-node so its `cache: pnpm` can find the pnpm store.
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run format:check
            - run: pnpm test

    e2e:
        name: e2e ${{ matrix.file }} (apify-cli + ${{ matrix.engine }})
        # `podman-3.4` is the Podman 3.x leg: Ubuntu 22.04's stock Podman 3.4.4, which the ubuntu-22.04
        # runner image ships preinstalled - the CNI generation, with no usable user-defined networks.
        runs-on: ${{ matrix.engine == 'podman-3.4' && 'ubuntu-22.04' || 'ubuntu-latest' }}
        # `all-modes` also installs and compiles the Actor's sources on the runner, hence the wider budget.
        timeout-minutes: ${{ matrix.file == 'all-modes' && 45 || 30 }}
        strategy:
            fail-fast: false
            # One job per e2e file and container engine. Each file starts its own runtime container on
            # the fixed host ports (3333/3000), so files cannot share a daemon; separate runners make them
            # parallel instead. The `podman` legs drive the runner's preinstalled Podman rootless, as the
            # runner user - the same suite, unchanged, against the other supported engine (`test.md`):
            # Podman 4 on the default runner, Podman 3.4 on the Ubuntu 22.04 one.
            matrix:
                engine:
                    - docker
                    - podman
                    - podman-3.4
                file:
                    - actor-dev-loop
                    - debug-mode
                    - dev-folder-bind-mount
                    - browser-view-ts
                    - browser-view-py
                    - all-modes
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Rootless Podman serves its Docker-compatible API on a socket only when asked to. The suite
            # drives Podman through `CONTAINER_CLI=podman` and mounts the socket named by `DOCKER_HOST`
            # into the runtime container.
            - name: Serve the Podman API socket
              if: startsWith(matrix.engine, 'podman')
              run: |
                  podman --version
                  sock="$RUNNER_TEMP/podman.sock"
                  nohup podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/podman-service.log" 2>&1 &
                  for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
                  podman --url "unix://$sock" info --format '{{.Host.Arch}}' >/dev/null
                  echo "CONTAINER_CLI=podman" >> "$GITHUB_ENV"
                  echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
            # The suite manages the engine itself against the runner's daemon: it pre-pulls the
            # Actor base images, builds the runtime image, starts the runtime container with
            # the host engine's socket, and drives it with stock apify-cli via npx.
            - run: pnpm exec vitest run test/e2e/${{ matrix.file }}.test.ts
            # The e2e's runtime container is normally removed by the suite's afterAll; on
            # failure it is left running, so its server-side view of any failed request
            # (log-stream lifecycle included) is captured here for diagnosis.
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  cli=${{ matrix.engine == 'docker' && 'docker' || 'podman' }}
                  for c in $($cli ps -aq --filter name=actor-runtime-e2e); do
                    $cli logs --tail 300 "$c" || true
                  done

    e2e-arm64:
        name: e2e actor-dev-loop (apify-cli + docker on arm64)
        # Nothing else in CI touches arm64: `release.yml` publishes a multi-arch manifest but is
        # dispatch-only, so a Dockerfile change that breaks arm64 would only surface at release time.
        # This runner is native arm64, so the suite's own `docker build` and every container it starts are
        # the real thing, not emulation.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Only the dev-loop file: both Playwright base images are amd64-only, so `browser-view-*` and
            # `all-modes` cannot run here at all. Everything this file needs is multi-arch.
            - run: pnpm exec vitest run test/e2e/actor-dev-loop.test.ts
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  for c in $(docker ps -aq --filter name=actor-runtime-e2e); do
                    docker logs --tail 300 "$c" || true
                  done

    e2e-macos:
        name: e2e actor-dev-loop (apify-cli + docker on macOS)
        # `system.md` lists macOS as a supported host, and nothing verified it until now.
        #
        # The INTEL runner, deliberately - do not "modernize" this to `macos-15`/`macos-latest`. An engine
        # on macOS needs a Linux VM, and Apple silicon runners have no virtualization available at all:
        # `colima start` there dies with `VZErrorDomain Code=2` before any container exists.
        runs-on: macos-15-intel
        # No engine is preinstalled, so this job also pays for a VM boot and runs against a QEMU daemon.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Both extra formulae are load-bearing. `qemu` is Colima's VM driver on Intel and the source
            # of the `qemu-img` it shells out to for disks; nothing else pulls it in since Lima dropped the
            # dependency. `docker-buildx` is needed because the `docker` formula is the CLI alone, and
            # without the plugin `docker build` falls back to the legacy builder, which cannot expand
            # `$BUILDPLATFORM` and fails our Dockerfile's first line.
            #
            # DOCKER_HOST is deliberately NOT set: the suite mounts the engine socket into the runtime
            # container, and a `-v` source is resolved by the daemon - inside the VM, where the socket is
            # at the default `/var/run/docker.sock`. Colima's host-side forwarding socket is not reachable
            # from in there.
            - name: Start a container engine (Colima)
              run: |
                  brew install colima docker docker-buildx qemu
                  mkdir -p ~/.docker/cli-plugins
                  ln -sfn "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
                  # The VM sometimes boots without cloud-init ever signalling completion, leaving
                  # `colima start` waiting on `/run/lima-boot-done` until it gives up. One clean retry.
                  colima start --cpu 3 --memory 8 --disk 20 || {
                      colima delete --force || true
                      colima start --cpu 3 --memory 8 --disk 20
                  }
                  docker version
                  docker buildx version
                  docker info --format '{{.OperatingSystem}} / {{.Architecture}}'
            # The VM's boot/hostagent logs, which `colima start` only points at by path.
            - name: Dump Colima VM logs on failure
              if: failure()
              run: |
                  colima status || true
                  df -h / || true
                  for log in ~/.colima/_lima/colima/ha.stderr.log ~/.colima/_lima/colima/serial*.log; do
                    if [ -f "$log" ]; then
                      echo "--- $log ---"
                      tail -100 "$log"
                    fi
                  done
            # Only the dev-loop file - a budget choice, not a technical limit: macOS minutes bill at a
            # multiple of Linux ones, so this leg protects the core flow and leaves the rest to Linux.
            - run: pnpm exec vitest run test/e2e/actor-dev-loop.test.ts
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  for c in $(docker ps -aq --filter name=actor-runtime-e2e); do
                    docker logs --tail 300 "$c" || true
                  done
