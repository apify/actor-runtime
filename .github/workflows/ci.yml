name: CI

on:
    push:
        branches: [master, v2-poc-requirements]
    pull_request:

jobs:
    checks:
        name: Build, lint, unit + integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            # Installs the pnpm version pinned by package.json's `packageManager` field; must run
            # before setup-node so its `cache: pnpm` can find the pnpm store.
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run format:check
            - run: pnpm test

    e2e:
        name: e2e ${{ matrix.file }} (apify-cli + ${{ matrix.engine }})
        # `podman-3.4` is the Podman 3.x leg: Ubuntu 22.04's stock Podman 3.4.4, which the ubuntu-22.04
        # runner image ships preinstalled - the CNI generation, with no usable user-defined networks.
        runs-on: ${{ matrix.engine == 'podman-3.4' && 'ubuntu-22.04' || 'ubuntu-latest' }}
        # `all-modes` also installs and compiles the Actor's sources on the runner, hence the wider budget.
        timeout-minutes: ${{ matrix.file == 'all-modes' && 45 || 30 }}
        strategy:
            fail-fast: false
            # One job per e2e file and container engine. Each file starts its own runtime container on
            # the fixed host ports (3333/3000), so files cannot share a daemon; separate runners make them
            # parallel instead. The `podman` legs drive the runner's preinstalled Podman rootless, as the
            # runner user - the same suite, unchanged, against the other supported engine (`test.md`):
            # Podman 4 on the default runner, Podman 3.4 on the Ubuntu 22.04 one.
            matrix:
                engine:
                    - docker
                    - podman
                    - podman-3.4
                file:
                    - actor-dev-loop
                    - debug-mode
                    - dev-folder-bind-mount
                    - nonstandard-actor
                    - browser-view-ts
                    - browser-view-py
                    - all-modes
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Rootless Podman serves its Docker-compatible API on a socket only when asked to. The suite
            # drives Podman through `CONTAINER_CLI=podman` and mounts the socket named by `DOCKER_HOST`
            # into the runtime container.
            - name: Serve the Podman API socket
              if: startsWith(matrix.engine, 'podman')
              run: |
                  podman --version
                  sock="$RUNNER_TEMP/podman.sock"
                  nohup podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/podman-service.log" 2>&1 &
                  for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
                  podman --url "unix://$sock" info --format '{{.Host.Arch}}' >/dev/null
                  echo "CONTAINER_CLI=podman" >> "$GITHUB_ENV"
                  echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
            # The suite manages the engine itself against the runner's daemon: it pre-pulls the
            # Actor base images, builds the runtime image, starts the runtime container with
            # the host engine's socket, and drives it with stock apify-cli via npx.
            - run: pnpm exec vitest run test/e2e/${{ matrix.file }}.test.ts
            # The e2e's runtime container is normally removed by the suite's afterAll; on
            # failure it is left running, so its server-side view of any failed request
            # (log-stream lifecycle included) is captured here for diagnosis.
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  cli=${{ matrix.engine == 'docker' && 'docker' || 'podman' }}
                  for c in $($cli ps -aq --filter name=actor-runtime-e2e); do
                    $cli logs --tail 300 "$c" || true
                  done

    e2e-arm64:
        name: e2e actor-dev-loop (apify-cli + docker on arm64)
        # The Linux arm64 coverage in CI (`e2e-macos-arm64` below is the other): `release.yml` builds
        # multi-arch but is dispatch-only, so an arm64 break would otherwise surface at release time.
        # Native, so nothing here is emulated.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Only this file. The browser-based cases need the amd64 emulation `startBuild`'s fallback
            # builds under, and nothing here installs binfmt/QEMU - an Apple Silicon Mac runs them.
            - run: pnpm exec vitest run test/e2e/actor-dev-loop.test.ts
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  for c in $(docker ps -aq --filter name=actor-runtime-e2e); do
                    docker logs --tail 300 "$c" || true
                  done

    e2e-macos-arm64:
        name: e2e actor-dev-loop (apify-cli + docker on macOS arm64, self-hosted)
        # The one leg on the platform most developers run the runtime on: an Apple Silicon Mac, with the
        # engine in a Linux VM and the socket the runtime container gets mounted (`/var/run/docker.sock`)
        # being the VM's, not a kernel socket of the host. The runner is a clean Mac - no Docker, Podman
        # or OrbStack - so the job brings its own engine (Colima + the Docker CLI, user space, no sudo;
        # `.github/scripts/macos-docker-engine.sh`) and removes it again when done. It is a persistent
        # self-hosted machine, so unlike every hosted leg above it is also cleaned before and after.
        #
        # Self-hosted, so never for a fork's pull request: `pull_request` runs the head branch's code,
        # and the runner is a long-lived Apify machine. Pushes to master and same-repo PRs only.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, macOS, ARM64]
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            # Downloads pinned Docker CLI, buildx, Lima and Colima into the job's temp dir, starts the VM
            # and smoke-tests the socket mount the suite relies on. Exports the engine's env to the job;
            # it deliberately does not set `DOCKER_HOST` (see the script for why).
            - name: Install a Docker engine (Colima, user space)
              run: .github/scripts/macos-docker-engine.sh install
            # A previous job on this machine may have been cancelled or timed out mid-suite. The engine is
            # new, so there is nothing of ours left in it; this catches the suite's temp dirs and, above
            # all, fails with the holder named if 3333/3000 is taken by something that is not ours, rather
            # than letting `docker run` fail deep in `beforeAll`.
            - name: Clean up leftovers of earlier runs
              run: .github/scripts/e2e-host-cleanup.sh --require-free-ports
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Only this file for now - the smallest end-to-end exercise of the whole chain (build the
            # runtime image, run it, push/build/call two Actors through apify-cli) on this executor. The
            # browser-view and all-modes files are the candidates to add next; their fallback builds need
            # amd64 emulation, which is Colima's `--vz-rosetta` switch in the install script.
            - run: pnpm exec vitest run test/e2e/actor-dev-loop.test.ts
            - name: Dump runtime container logs on failure
              if: failure()
              run: |
                  for c in $(docker ps -aq --filter name=actor-runtime-e2e); do
                    docker logs --tail 300 "$c" || true
                  done
            # Always, so the next job starts clean whatever happened here. The engine and everything in
            # it goes in the next step anyway; this one is for the suite's temp dirs on the host.
            - name: Clean up
              if: always()
              run: .github/scripts/e2e-host-cleanup.sh
            # Stops and deletes the VM and removes the binaries, Colima's state, the isolated docker config
            # and Lima's image cache - the machine is left as the job found it.
            - name: Remove the Docker engine
              if: always()
              run: .github/scripts/macos-docker-engine.sh teardown
