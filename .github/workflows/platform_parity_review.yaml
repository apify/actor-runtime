# Hands a pull request to the Actor Runtime Review Managed Agent. The agent is defined in
# apify/apify-tooling-orchestration (`automations/actor-runtime-review/`); it compares the pull request with how the
# real Apify platform behaves and posts its comment itself.
#
# One session per pull request: the shared `Agent session` workflow finds the agent's session carrying this
# pull request's metadata, or starts it, and delivers every push behind an interrupt, so a review of an older
# commit is never finished, let alone posted. The agent re-reads the head before posting, so a push this workflow
# does not run for (paths outside the filter) still never gets a stale comment. Closing or merging the pull
# request archives its session.
name: Platform parity review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, closed]
        paths:
            - src/**
            - docker/**
            - Dockerfile
            - requirements/**
            - skills/**

permissions:
    contents: read

# One run per pull request at a time, and of the runs waiting behind it only the newest survives, so pushes reach
# the session in order and a push that is already superseded is not sent at all.
concurrency:
    group: platform-parity-review-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    review:
        name: Send the pull request to its review session
        # Secrets are not available to PRs from forks
        if: >-
            github.event.action != 'closed'
            && github.event.pull_request.head.repo.full_name == github.repository
            && !github.event.pull_request.draft
        uses: apify/apify-tooling-orchestration/.github/workflows/agent_session.yaml@7bca4b020c38fe2ea6d497d97337f3e791a74ae9
        with:
            agent_dir: automations/actor-runtime-review/agents
            title: "PR #${{ github.event.pull_request.number }}"
            metadata: |
                repository=${{ github.repository }}
                pull_request=${{ github.event.pull_request.number }}
            created_after: ${{ github.event.pull_request.created_at }}
            message: "Review this pull request: ${{ github.event.pull_request.html_url }} (head commit ${{ github.event.pull_request.head.sha }})."
        secrets:
            anthropic_api_key: ${{ secrets.ACTOR_RUNTIME_REVIEW_KEY }}
            repository_token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

    archive:
        name: Archive the review session
        if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        uses: apify/apify-tooling-orchestration/.github/workflows/agent_session.yaml@7bca4b020c38fe2ea6d497d97337f3e791a74ae9
        with:
            action: archive
            agent_dir: automations/actor-runtime-review/agents
            metadata: |
                repository=${{ github.repository }}
                pull_request=${{ github.event.pull_request.number }}
            created_after: ${{ github.event.pull_request.created_at }}
        secrets:
            anthropic_api_key: ${{ secrets.ACTOR_RUNTIME_REVIEW_KEY }}
            repository_token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
