# Hands a pull request to the Actor Runtime Review Managed Agent. The agent is defined in
# apify/apify-tooling-orchestration (`automations/actor-runtime-review/`); it compares the pull request with how the
# real Apify platform behaves and posts its comment itself.
#
# One session per pull request: `apify-agents send` finds the agent's session carrying this pull request's
# metadata, or starts it, and delivers every push behind an interrupt, so a review of an older commit is never
# finished, let alone posted. The agent re-reads the head before posting, so a push this workflow does not run for
# (paths outside the filter) still never gets a stale comment. Closing or merging the pull request archives its
# session with `apify-agents archive`.
name: Platform parity review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, closed]
        paths:
            - src/**
            - docker/**
            - Dockerfile
            - requirements/**
            - skills/**

permissions:
    contents: read

# One run per pull request at a time, and of the runs waiting behind it only the newest survives, so pushes reach
# the session in order and a push that is already superseded is not sent at all.
concurrency:
    group: platform-parity-review-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    session:
        name: ${{ github.event.action == 'closed' && 'Archive the review session' || 'Send the pull request to its review session' }}
        runs-on: ubuntu-latest
        # Secrets are not available to PRs from forks. A draft is not reviewed, but closing one still archives.
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && (github.event.action == 'closed' || !github.event.pull_request.draft)
        env:
            ANTHROPIC_API_KEY: ${{ secrets.ACTOR_RUNTIME_REVIEW_KEY }}
            AGENT_DIR: automations/actor-runtime-review/agents
            REPOSITORY: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PR_CREATED_AT: ${{ github.event.pull_request.created_at }}

        steps:
            # The tooling and the agent's ids live in apify/apify-tooling-orchestration. It is an internal repository,
            # which a public one can neither call reusable workflows from nor read with its own token.
            - uses: actions/checkout@v4
              with:
                  repository: apify/apify-tooling-orchestration
                  ref: master
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
            - uses: astral-sh/setup-uv@v7
            - run: uv sync --all-packages

            - name: Send the push to the pull request's session
              if: github.event.action != 'closed'
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  uv run apify-agents send "$AGENT_DIR" \
                      --metadata "repository=$REPOSITORY" --metadata "pull_request=$PR_NUMBER" \
                      --created-after "$PR_CREATED_AT" --title "PR #$PR_NUMBER" \
                      --message "Review this pull request: $PR_URL (head commit $HEAD_SHA)." \
                      | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Archive the pull request's session
              if: github.event.action == 'closed'
              run: |
                  uv run apify-agents archive "$AGENT_DIR" \
                      --metadata "repository=$REPOSITORY" --metadata "pull_request=$PR_NUMBER" \
                      --created-after "$PR_CREATED_AT" \
                      | tee -a "$GITHUB_STEP_SUMMARY"
